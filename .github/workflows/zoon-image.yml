name: Build zoon Hermes image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: zoon-hermes-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c9c0c18556b85f # v3

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable amd64 image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/prvk/hermes-agent:zoon-502-e40087449
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: HERMES_GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=zoon-hermes-amd64
          cache-to: type=gha,mode=max,scope=zoon-hermes-amd64
