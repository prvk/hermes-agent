name: Build zoon Hermes image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: zoon-hermes-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/prvk/hermes-agent:zoon-502-e40087449
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: HERMES_GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=zoon-hermes-amd64
          cache-to: type=gha,mode=max,scope=zoon-hermes-amd64
